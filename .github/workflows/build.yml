name: Sestavit aplikaci

on:
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Podpisový klíč
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore/anglictina.jks
            echo "SIGNED=1" >> $GITHUB_ENV
          elif [ -f keystore/anglictina.jks ]; then
            echo "SIGNED=1" >> $GITHUB_ENV
          else
            echo "::warning::Chybí secret KEYSTORE_B64 – sestavuji jen zkušební verzi s dočasným klíčem (nevydává se)."
            keytool -genkeypair -keystore keystore/anglictina.jks -alias anglictina -keyalg RSA -keysize 2048 -validity 365 \
              -storepass anglictina -keypass anglictina -dname "CN=Test" >/dev/null
          fi
      - name: Sestavit APK
        env:
          DATA_OWNER: ${{ github.repository_owner }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Připravit soubor
        run: cp app/build/outputs/apk/release/app-release.apk anglictina.apk
      - uses: actions/upload-artifact@v4
        with:
          name: anglictina-apk
          path: anglictina.apk
      - name: Vydat novou verzi
        if: env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Angličtina B1+ 1.0.${{ github.run_number }}
          body: Nainstaluj soubor anglictina.apk do telefonu s Androidem.
          files: anglictina.apk
          make_latest: true
